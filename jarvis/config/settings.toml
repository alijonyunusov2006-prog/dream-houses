# Настройки JARVIS (не секреты — секреты в .env)

[owner]
name = "Владелец"
language = "ru"
timezone = "Asia/Dushanbe"

[paths]
projects_root = "C:/Projects"          # новые проекты, которые разрабатывает JARVIS
brain = "brain"
tasks_file = "data/tasks.json"         # локальная копия очереди (этап 3 — Supabase)

[models]
planner = "opus"                       # ТЗ, план, ревью
developer = "sonnet"
tester = "sonnet"
bulk = "haiku"                         # сортировка, короткие ответы
local = "qwen3.5:27b"                  # OpenJarvis / Ollama: офлайн и рутина (RTX 3090 24 ГБ — влезает целиком)
local_fast = "qwen3.5:4b"              # сортировка сообщений, когда GPU занят рендером

[disk]
min_free_gb = 50                       # C: почти полон (≈80 ГБ из 1,86 ТБ на 2026-09-27) — предупреждать ниже порога
archive_target = "D:/Archive"          # HDD (≈ через 10 дней): ТОЛЬКО холодный архив; ежедневное остаётся на C: (SSD)

# Настройки конкретной машины накладываются поверх этого файла: config/machines/<COMPUTERNAME>.toml
# (пути, GPU, принтеры). См. docs/DECISIONS/0005-portability-laptop.md.

[budget]
daily_usd_equivalent = 15.0            # стоп-кран раннера (эквивалент API по total_cost_usd)
warn_at_percent = 80

[claude_code]
permission_mode = "acceptEdits"
max_turns = 40
default_allowed_tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]

[telegram]
escalation_minutes = 10                # нет ответа на срочный вопрос → позвонить (когда будут звонки)
report_hour = 8                        # утренний дайджест

[printers]
# Имена ресурсов планировщика и способ управления. Секреты (IP, коды) — в .env.
slicer = "orcaslicer"                  # один слайсер для обоих принтеров

[printers.bambu-p1s]
vendor = "bambu"
control = "lan-developer-mode"         # LAN-only + Developer Mode → MQTT 8883 / FTP 990
bed_mm = [256, 256, 256]
multicolor = "ams"                     # уточнить: есть ли AMS

[printers.creality-k1]
vendor = "creality"
control = "moonraker"                  # root + Creality Helper Script → Moonraker http://<ip>:7125
bed_mm = [220, 220, 250]
multicolor = "none"

[speech]
stt_model = "large-v3"                 # faster-whisper; на слабом ПК — "medium"
stt_language = "ru"
tts_engine = "qwen3-tts"               # qwen3-tts (основной, GPU) | chatterbox (запасной, GPU) | piper (CPU, когда GPU занят)
tts_fallback = "piper"                 # только бесплатные локальные движки — решение владельца
wake_word = "джарвис"
voice = ""                             # выбранный голос: имя образца из data/voices/samples (выбирает владелец)

[energy]
# Свет — отдельная строка в отчётах (core/jarviscore/energy.py). Тарифы с 01.02.2026, постановление № 709.
tariff = "business"                    # ПК стоит в студии (владелец, 2026-10-03): 0,9465 сомони/кВт·ч | population = 0,4137 (дом)
base_watts = 60                        # плата, память, диски, вентиляторы — добавка к замерам GPU и CPU
report_daily = true                    # «⚡ Свет за сутки: … кВт·ч ≈ … сомони» в утреннем отчёте

