[project]
name = "jarviscore"
version = "0.1.0"
description = "JARVIS — управляющий агент: политика доступа, планировщик, раннер Claude Code, отчёты"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
speech = ["faster-whisper>=1.0"]
gateway = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
jv = "jarviscore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/jarviscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
